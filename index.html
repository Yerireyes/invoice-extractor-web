<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Extrae datos de facturas con IA, revísalos y descárgalos en Excel o PDF."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121a16" media="(prefers-color-scheme: dark)" />
    <title>Invoice Extractor</title>
    <script>
      // Apply the theme before first paint to avoid a flash: the saved choice ('light' / 'dark',
      // see src/app/theme/theme.ts) or else the system's, following it while the app loads.
      ;(function () {
        var media = window.matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          var saved = null
          try {
            saved = localStorage.getItem('theme')
          } catch (error) {}
          var dark = saved === 'dark' || (saved !== 'light' && media.matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        }
        apply()
        media.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
